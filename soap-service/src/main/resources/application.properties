# Application
spring.application.name=soap-service
server.port=8081

# ============================================
# CONFIGURATION BASE DE DONNÉES
# ============================================
# Pour utiliser H2 (base en mémoire - pour tests rapides) :
# Démarrez avec : mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# Pour utiliser PostgreSQL (production) :
# 1. Créez la base de données : CREATE DATABASE server_management_soap;
# 2. Modifiez les paramètres ci-dessous avec vos credentials
# 3. Démarrez normalement : mvn spring-boot:run
# ============================================

# PostgreSQL Configuration (Production - ACTIF)
spring.datasource.url=jdbc:postgresql://localhost:5432/server_management_soap
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database Configuration (Développement/Test - DÉSACTIVÉ)
# Pour utiliser H2 à la place, décommentez ces lignes et commentez PostgreSQL ci-dessus
#spring.datasource.url=jdbc:h2:mem:server_management_soap
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (désactivé car on utilise PostgreSQL)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.ws=DEBUG